# ═══════════════════════════════════════════════════════════════
# TrendRadar 個人設定檔
# 用途：每日財經輿情 + 國際新聞 RSS 彙整推送 Telegram
# 時區：台灣 (UTC+8)
# ═══════════════════════════════════════════════════════════════

# ── 1. 基礎設置 ──────────────────────────────────────────────
app:
  timezone: "Asia/Taipei"
  show_version_update: true

# ── 1.5 排程：每日早上 8:00 推送一次 ─────────────────────────
# 使用 morning_evening 模板：早上彙整 + 晚間當日總結
schedule:
  enabled: true
  preset: "morning_evening"

# ── 2. 熱榜平台（輿情來源）────────────────────────────────────
# 保留財經相關平台，移除娛樂類
platforms:
  enabled: true
  sources:
    - id: "wallstreetcn-hot"
      name: "華爾街見聞 熱門"
    - id: "wallstreetcn-news"
      name: "華爾街見聞 最新"
    - id: "cls-hot"
      name: "財聯社 熱門"
    - id: "cls-telegraph"
      name: "財聯社 電報"
    - id: "jin10"
      name: "金十數據"
    - id: "gelonghui"
      name: "格隆匯"
    - id: "fastbull"
      name: "快牛財經"
    - id: "thepaper"
      name: "澎湃新聞"
    - id: "zhihu"
      name: "知乎"
    - id: "weibo"
      name: "微博"
    - id: "baidu"
      name: "百度熱搜"
    # 以下娛樂平台暫時關閉，需要時取消 # 即可開啟
    # - id: "toutiao"
    #   name: "今日頭條"
    # - id: "bilibili-hot-search"
    #   name: "bilibili 熱搜"
    # - id: "douyin"
    #   name: "抖音"

# ── 3. RSS 訂閱（國際新聞 + Blog）────────────────────────────
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1   # 只推送 24 小時內的新文章

  feeds:
    # ── 財經（付費媒體 RSS 標題免費可用）
    - id: "wsj-markets"
      name: "WSJ Markets"
      url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"

    - id: "wsj-world"
      name: "WSJ World News"
      url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"

    - id: "bloomberg-markets"
      name: "Bloomberg Markets"
      url: "https://feeds.bloomberg.com/markets/news.rss"

    - id: "bloomberg-tech"
      name: "Bloomberg Technology"
      url: "https://feeds.bloomberg.com/technology/news.rss"

    - id: "cnbc-top"
      name: "CNBC Top News"
      url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"

    - id: "reuters"
      name: "Reuters Top News"
      url: "https://feeds.reuters.com/reuters/topNews"

    # ── 綜合國際
    - id: "bbc-world"
      name: "BBC World"
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"

    - id: "ft"
      name: "Financial Times"
      url: "https://www.ft.com/?format=rss"
      enabled: false   # FT RSS 有時不穩定，先關閉，確認可用再開

    # ── 預留：你的 Blog RSS（取消 # 填入 URL）
    # - id: "my-blog-1"
    #   name: "我的 Blog 1"
    #   url: "https://你的blog.com/feed"
    #
    # - id: "my-blog-2"
    #   name: "我的 Blog 2"
    #   url: "https://另一個blog.com/rss.xml"

# ── 4. 報告模式 ───────────────────────────────────────────────
report:
  mode: "daily"           # daily = 當日完整彙整（適合每日總結）
  display_mode: "keyword" # 按關鍵字分組
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

# ── 4.5 篩選方式 ──────────────────────────────────────────────
filter:
  method: "ai"            # 用 AI 智能篩選（比關鍵字更靈活）
  priority_sort_enabled: true

ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.6          # 0.6 = 平衡精準與覆蓋率
  reclassify_threshold: 0.6

# ── 5. 推送內容顯示順序 ───────────────────────────────────────
display:
  region_order:
    - ai_analysis     # AI 分析放最前面，第一眼看重點
    - new_items       # 新增熱點（標記 🆕）
    - rss             # RSS 國際新聞
    - hotlist         # 熱榜輿情
    - standalone      # 獨立展示（華爾街見聞完整榜）

  regions:
    hotlist: true
    new_items: true
    rss: true
    standalone: true    # 開啟完整華爾街見聞榜單獨立顯示
    ai_analysis: true

  standalone:
    platforms: ["wallstreetcn-hot", "cls-hot"]  # 完整展示這兩個財經平台
    rss_feeds: []
    max_items: 15

# ── 6. 推送通知 ───────────────────────────────────────────────
# ⚠️ 安全提醒：如果你用 GitHub Actions 部署
#    請不要在這裡填 token，改填到 GitHub Secrets：
#    Settings → Secrets and variables → Actions
#    Secret 名稱：TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#
notification:
  enabled: true
  channels:
    telegram:
      bot_token: ""     # ← 填入你的 Bot Token（或用 GitHub Secret）
      chat_id: ""       # ← 填入你的 Chat ID（或用 GitHub Secret）

    # 其他推送方式（需要時取消 # 開啟）
    # email:
    #   from: "your@gmail.com"
    #   password: "gmail_app_password"
    #   to: "your@gmail.com"
    #   smtp_server: ""   # 留空自動識別
    #   smtp_port: ""

# ── 7. 儲存設定 ───────────────────────────────────────────────
storage:
  backend: "auto"       # GitHub Actions 自動使用遠端存儲
  formats:
    sqlite: true
    txt: false
    html: true          # 生成 HTML 報告

  local:
    data_dir: "output"
    retention_days: 7   # 保留 7 天資料

# ── 8. AI 模型 ────────────────────────────────────────────────
# 推薦使用 DeepSeek（便宜、中文強、支援繁體）
# 如果你有 Claude / OpenAI API key 也可以換
ai:
  model: "deepseek/deepseek-chat"
  api_key: ""           # ← 填入 DeepSeek API Key（或 GitHub Secret: AI_API_KEY）
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1

  # 如果要用 Claude（Anthropic）改成：
  # model: "anthropic/claude-3-5-sonnet-20241022"
  # api_key: ""  # Anthropic API Key

# ── 9. AI 分析 ────────────────────────────────────────────────
ai_analysis:
  enabled: true
  language: "繁體中文"   # 輸出繁體中文分析
  prompt_file: "ai_analysis_prompt.txt"
  mode: "daily"         # 每日彙整分析
  max_news_for_analysis: 100
  include_rss: true     # RSS 也納入 AI 分析
  include_standalone: true
  include_rank_timeline: false  # 關閉排名時間線以節省 token

# ── 10. AI 翻譯 ───────────────────────────────────────────────
ai_translation:
  enabled: true
  language: "繁體中文"   # 把英文新聞標題翻譯成繁體中文
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: false
    rss: true           # RSS 英文標題自動翻譯
    standalone: true

# ── 11. 同花順 iFinD 財經新聞 ─────────────────────────────────
# 直接抓取同花順公開財經新聞，整合進 RSS 管道推送
ifind:
  enabled: true
  timeout: 15
  request_interval: 1500   # 毫秒，請求間隔
  sources:
    - id: "ifind-quick"
      name: "同花順 7*24快訊"
      type: "quick"         # 7*24 滾動即時快訊
      enabled: true
      max_items: 50

    - id: "ifind-news"
      name: "同花順 財經要聞"
      type: "news"          # 財經要聞頭條
      enabled: true
      max_items: 30

# ── 12. 進階設定 ──────────────────────────────────────────────
advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
